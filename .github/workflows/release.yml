name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.2'
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run distribution:check
          if [ -n "$RELEASE_TAG" ]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          test -z "$(git status --porcelain)"
      - name: Package CLI archive and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/guard-package"
          npm pack --offline --ignore-scripts --pack-destination "$RUNNER_TEMP/guard-package"
          cd "$RUNNER_TEMP/guard-package"
          sha256sum ./*.tgz > SHA256SUMS
      - name: Publish experimental GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node quality/release-notes.mjs > "$RUNNER_TEMP/guard-release-notes.md"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/guard-package/*.tgz "$RUNNER_TEMP/guard-package/SHA256SUMS" --verify-tag --prerelease --title "CI Local Guard ${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/guard-release-notes.md"
