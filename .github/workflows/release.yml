name: Release
on:
  workflow_dispatch: # Rehearsal only; never publishes.
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.2'
      - run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          npm run distribution:check
          if [ -n "$RELEASE_TAG" ]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          test -z "$(git status --porcelain)"
      - name: Pack and rehearse exact archive
        run: |
          mkdir -p "$RUNNER_TEMP/guard-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/guard-package"
          npm publish "$RUNNER_TEMP"/guard-package/*.tgz --dry-run --ignore-scripts --access public --tag next --registry=https://registry.npmjs.org/
      - name: Publish through npm trusted publisher
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: npm publish "$RUNNER_TEMP"/guard-package/*.tgz --ignore-scripts --access public --tag next --provenance --registry=https://registry.npmjs.org/
